name: Monitor SIEDCO Jamundí - Consolidado Multi-Delito

on:
  schedule:
    # Contraste mensual posterior al corte oficial: dia 18, 07:53 America/Bogota.
    - cron: "53 12 18 * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Forzar correo aunque las cifras no hayan cambiado"
        required: false
        default: false
        type: boolean

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: monitor-siedco-publico
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Restaurar caché de datos de SIEDCO
        uses: actions/cache@v4
        with:
          path: |
            resumen_actual.json
            resumen_anterior.json
          key: siedco-cache-${{ github.run_id }}
          restore-keys: |
            siedco-cache-

      - name: Ejecutar Monitor SIEDCO
        id: monitor_run
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS || secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DEST: ${{ secrets.EMAIL_DEST }}
          FORCE_SIEDCO_NOTIFICATION: ${{ inputs.notify || 'false' }}
        run: python monitor_siedco.py

      - name: Reportar estado al Centro de fuentes SISC
        if: always()
        continue-on-error: true
        env:
          SISC_API_URL: "https://sisc-backend.onrender.com/api"
          SISC_MONITOR_OUTCOME: ${{ steps.monitor_run.outcome }}
        run: python sisc_heartbeat.py

      - name: Conservar reporte SISC para sincronizacion local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sisc-heartbeat
          path: sisc-heartbeat.json
          if-no-files-found: warn
          retention-days: 30
